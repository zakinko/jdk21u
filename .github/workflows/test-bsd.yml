#
# Run tier1 on a real BSD, in a virtual machine on the Linux runner.
# NetBSD, FreeBSD, OpenBSD and DragonFly each boot through their own
# vmactions action and run .github/scripts/bsd-tier1-in-vm.sh.
#
# The BSD build cross-compiles and cannot run a line of what it produces, so
# what it proves stops at "it compiles". This picks the bundles up and runs
# them on the operating system itself.
#
# tier1 takes about nine hours on a 3-core, 2GB NetBSD machine, and a hosted
# job is cut off at six. It is therefore split the way upstream's own test.yml
# splits it -- thirteen parts, the largest of which measured 70 minutes on that
# machine, so each has room to spare even before the extra memory this VM gets.
#
name: 'Test (bsd)'

on:
  workflow_call:
    inputs:
      target-os:
        required: false
        type: string
        default: 'netbsd'
      platform:
        required: false
        type: string
        default: 'bsd-x86_64-netbsd'
      release:
        description: 'The BSD release to run in, the one the sysroot is from'
        required: false
        type: string
        default: '10.1'
      arch:
        description: >-
          The machine the guest runs as.  Empty is the image's own default,
          which is x86_64.  A guest whose architecture differs from the
          runner's is emulated, so aarch64 belongs with an arm64 runner.
        required: false
        type: string
        default: ''
      timeout-factor:
        description: "jtreg's TIMEOUT_FACTOR; an emulated guest needs more"
        required: false
        type: string
        default: '4'
      hotspot-only:
        description: 'Run only the HotSpot groups; see the matrix below'
        required: false
        type: boolean
        default: false
      runner:
        description: 'The GitHub runner to boot the guest on'
        required: false
        type: string
        default: 'ubuntu-24.04'

jobs:
  test:
    name: ${{ matrix.part.name }}
    runs-on: ${{ inputs.runner }}

    strategy:
      fail-fast: false
      # The same thirteen groups upstream's test.yml uses, so that a part
      # failing here can be compared with the same part on Linux. jaxp is
      # not among them: its tier1 selects no tests.  hotspot-only keeps the
      # seven HotSpot groups that exercise the JIT and the runtime -- what
      # depends on the CPU -- for the emulated guests, where the library and
      # langtools groups run past the six-hour limit and the same tests are
      # measured on x86_64 anyway; serviceability is left out with them, the
      # SA not being built on the BSDs outside x86_64.
      matrix:
        part: ${{ fromJSON(inputs.hotspot-only && '[{"name":"hs/tier1 common","suite":"test/hotspot/jtreg/:tier1_common","slug":"hs-common"},{"name":"hs/tier1 compiler part 1","suite":"test/hotspot/jtreg/:tier1_compiler_1","slug":"hs-compiler1"},{"name":"hs/tier1 compiler part 2","suite":"test/hotspot/jtreg/:tier1_compiler_2","slug":"hs-compiler2"},{"name":"hs/tier1 compiler part 3","suite":"test/hotspot/jtreg/:tier1_compiler_3","slug":"hs-compiler3"},{"name":"hs/tier1 compiler not-xcomp","suite":"test/hotspot/jtreg/:tier1_compiler_not_xcomp","slug":"hs-compiler-not-xcomp"},{"name":"hs/tier1 gc","suite":"test/hotspot/jtreg/:tier1_gc","slug":"hs-gc"},{"name":"hs/tier1 runtime","suite":"test/hotspot/jtreg/:tier1_runtime","slug":"hs-runtime"}]' || '[{"name":"jdk/tier1 part 1","suite":"test/jdk/:tier1_part1","slug":"jdk-part1"},{"name":"jdk/tier1 part 2","suite":"test/jdk/:tier1_part2","slug":"jdk-part2"},{"name":"jdk/tier1 part 3","suite":"test/jdk/:tier1_part3","slug":"jdk-part3"},{"name":"langtools/tier1","suite":"test/langtools/:tier1","slug":"langtools"},{"name":"hs/tier1 common","suite":"test/hotspot/jtreg/:tier1_common","slug":"hs-common"},{"name":"hs/tier1 compiler part 1","suite":"test/hotspot/jtreg/:tier1_compiler_1","slug":"hs-compiler1"},{"name":"hs/tier1 compiler part 2","suite":"test/hotspot/jtreg/:tier1_compiler_2","slug":"hs-compiler2"},{"name":"hs/tier1 compiler part 3","suite":"test/hotspot/jtreg/:tier1_compiler_3","slug":"hs-compiler3"},{"name":"hs/tier1 compiler not-xcomp","suite":"test/hotspot/jtreg/:tier1_compiler_not_xcomp","slug":"hs-compiler-not-xcomp"},{"name":"hs/tier1 gc","suite":"test/hotspot/jtreg/:tier1_gc","slug":"hs-gc"},{"name":"hs/tier1 runtime","suite":"test/hotspot/jtreg/:tier1_runtime","slug":"hs-runtime"},{"name":"hs/tier1 serviceability","suite":"test/hotspot/jtreg/:tier1_serviceability","slug":"hs-serviceability"},{"name":"lib-test/tier1","suite":"test/lib-test/:tier1","slug":"lib-test"}]') }}

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        id: bundles
        uses: ./.github/actions/get-bundles
        with:
          platform: ${{ inputs.platform }}

      # Whether the guest is accelerated decides whether a six-hour job is
      # enough, and it is easy to get wrong: qemu lists kvm under -accel
      # help when the binary was built with it, which says nothing about
      # this host.  The device is what counts, so print that.
      - name: 'Say whether this runner can accelerate a guest'
        run: |
          echo "runner: ${{ runner.os }} ${{ runner.arch }}"
          ls -l /dev/kvm || echo "/dev/kvm: absent, the guest will be emulated"

      # One step per BSD, because each has its own action; what runs inside
      # is the same script on all four.  prepare installs what the
      # makefiles and the script need, plus what the JDK itself links
      # against that the base system does not carry.
      - name: 'Run tests in a NetBSD virtual machine'
        uses: vmactions/netbsd-vm@v1.5.0
        with:
          release: ${{ inputs.release }}
          arch: ${{ inputs.arch }}
          mem: 12288
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR'
          # -U: the image carries some of these already, and pkg_add
          # refuses a newer version from the mirror without it -- "A
          # different version of bash-5.3.20 is already installed".  The
          # mirror has also answered "no pkg found for 'zip'" to one part
          # of twelve while the rest found it, so try a few times.  Five
          # tries at the CDN, half an hour apart in all, still ended in
          # "no pkg found for 'gmake'" on one part, so alternate with the
          # master site, which the CDN only fronts.
          prepare: |
            case `uname -m` in evbarm) a=aarch64 ;; *) a=`uname -m` ;; esac
            p=pub/pkgsrc/packages/NetBSD/$a/`uname -r`/All
            n=0
            until /usr/sbin/pkg_add -U bash gmake zip unzip; do
              n=$((n + 1)); [ $n -lt 6 ] || exit 1
              if [ $((n % 2)) = 1 ]; then h=ftp.NetBSD.org; else h=cdn.NetBSD.org; fi
              PKG_PATH=http://$h/$p; export PKG_PATH
              echo "retrying from $PKG_PATH in 30 seconds"; sleep 30
            done
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.part.suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
        if: inputs.target-os == 'netbsd'

      # jtreg's process tests read /proc, which FreeBSD does not mount.
      - name: 'Run tests in a FreeBSD virtual machine'
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.release }}
          arch: ${{ inputs.arch }}
          mem: 12288
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR'
          prepare: |
            mount -t procfs proc /proc
            pkg install -y bash gmake zip unzip gsed gnugrep
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.part.suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
        if: inputs.target-os == 'freebsd'

      # OpenBSD refuses a writable and executable mapping on a file system
      # not mounted wxallowed, and the workspace is under /home.  The JDK
      # links against libiconv, which OpenBSD ships as a package.
      - name: 'Run tests in an OpenBSD virtual machine'
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.release }}
          arch: ${{ inputs.arch }}
          mem: 12288
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR'
          prepare: |
            mount -u -o wxallowed /home
            until pkg_add bash gmake zip unzip-- gsed ggrep libiconv; do
              echo retrying in 10 seconds; sleep 10
            done
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.part.suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
        if: inputs.target-os == 'openbsd'

      - name: 'Run tests in a DragonFly virtual machine'
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: ${{ inputs.release }}
          mem: 12288
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR'
          prepare: |
            pkg install -y bash gmake zip unzip gsed gnugrep
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.part.suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
        if: inputs.target-os == 'dragonfly'

      - name: 'Package test results'
        run: |
          mkdir -p results
          if [ -d build ]; then
            # hs_err too.  A test that crashes leaves its .jtr saying only
            #
            #   # Problematic frame:
            #   #
            #
            # because the frame and the library map are in the hs_err file,
            # and that was not being collected.  Without it a SIGSEGV cannot
            # be attributed to anything -- java/foreign/LibraryLookupTest
            # crashed twice in the same place and there was nothing to read.
            find build -name '*.jtr' -o -name 'summary.txt' -o -name 'stats.txt' \
                       -o -name 'hs_err_pid*.log' -o -name 'replay_pid*.log' |
              while read f; do
                d="results/$(dirname "$f")"; mkdir -p "$d"; cp "$f" "$d/"
              done
          fi
        if: always()

      - name: 'Upload test results'
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ inputs.platform }}-${{ matrix.part.slug }}
          path: results
          retention-days: 14
        if: always()

      # make writes its verdict to a file rather than an exit status, and the
      # VM step returns 0 so that file gets carried out.  Read it here.
      #
      # Absent results are a failure too.  If the copy back quietly does not
      # happen, an empty workspace looks exactly like a clean run, which is
      # the shape of the bug this whole path exists to stop.
      - name: 'Fail the job when a test failed'
        run: |
          R=build/run-test-prebuilt
          if [ ! -d "$R/test-results" ]; then
            echo "$R/test-results is not here.  The VM's workspace did not"
            echo "come back, so nothing can be said about the tests."
            exit 1
          fi
          if [ -f "$R/make-support/exit-with-error" ]; then
            echo "tests failed -- the names are in the log above, the .jtr"
            echo "and hs_err files in the results artifact"
            exit 1
          fi
