#
# Run tier1 on a real BSD, in a virtual machine on the Linux runner.
#
# The BSD build cross-compiles and cannot run a line of what it produces, so
# what it proves stops at "it compiles". This picks the bundles up and runs
# them on the operating system itself.
#
# tier1 takes about nine hours on a 3-core, 2GB NetBSD machine, and a hosted
# job is cut off at six. It is therefore split the way upstream's own test.yml
# splits it -- twelve parts, the largest of which measured 70 minutes on that
# machine, so each has room to spare even before the extra memory this VM gets.
#
name: 'Test (bsd)'

on:
  workflow_call:
    inputs:
      target-os:
        required: false
        type: string
        default: 'netbsd'
      platform:
        required: false
        type: string
        default: 'bsd-x86_64-netbsd'
      release:
        description: 'The BSD release to run in'
        required: false
        type: string
        default: '10.1'

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        test-name:
          - 'jdk/tier1 part 1'
          - 'jdk/tier1 part 2'
          - 'jdk/tier1 part 3'
          - 'langtools/tier1'
          - 'hs/tier1 common'
          - 'hs/tier1 compiler part 1'
          - 'hs/tier1 compiler part 2'
          - 'hs/tier1 compiler part 3'
          - 'hs/tier1 gc'
          - 'hs/tier1 runtime'
          - 'hs/tier1 serviceability'
          - 'lib-test/tier1'

        # The same twelve groups upstream's test.yml uses, so that a part
        # failing here can be compared with the same part on Linux. jaxp is
        # not among them: its tier1 selects no tests.
        include:
          - test-name: 'jdk/tier1 part 1'
            test-suite: 'test/jdk/:tier1_part1'
            test-slug: 'jdk-part1'

          - test-name: 'jdk/tier1 part 2'
            test-suite: 'test/jdk/:tier1_part2'
            test-slug: 'jdk-part2'

          - test-name: 'jdk/tier1 part 3'
            test-suite: 'test/jdk/:tier1_part3'
            test-slug: 'jdk-part3'

          - test-name: 'langtools/tier1'
            test-suite: 'test/langtools/:tier1'
            test-slug: 'langtools'

          - test-name: 'hs/tier1 common'
            test-suite: 'test/hotspot/jtreg/:tier1_common'
            test-slug: 'hs-common'

          - test-name: 'hs/tier1 compiler part 1'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_1'
            test-slug: 'hs-compiler1'

          - test-name: 'hs/tier1 compiler part 2'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_2'
            test-slug: 'hs-compiler2'

          - test-name: 'hs/tier1 compiler part 3'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_3'
            test-slug: 'hs-compiler3'

          - test-name: 'hs/tier1 gc'
            test-suite: 'test/hotspot/jtreg/:tier1_gc'
            test-slug: 'hs-gc'

          - test-name: 'hs/tier1 runtime'
            test-suite: 'test/hotspot/jtreg/:tier1_runtime'
            test-slug: 'hs-runtime'

          - test-name: 'hs/tier1 serviceability'
            test-suite: 'test/hotspot/jtreg/:tier1_serviceability'
            test-slug: 'hs-serviceability'

          - test-name: 'lib-test/tier1'
            test-suite: 'test/lib-test/:tier1'
            test-slug: 'lib-test'

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        id: bundles
        uses: ./.github/actions/get-bundles
        with:
          platform: ${{ inputs.platform }}

      - name: 'Run tests in a NetBSD virtual machine'
        id: run-tests
        uses: vmactions/netbsd-vm@v1.5.0
        with:
          release: ${{ inputs.release }}
          mem: 6144
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE'
          prepare: |
            /usr/sbin/pkg_add bash gmake
          run: |
            set -e
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            JDK="$PWD/bundles/jdk/`ls bundles/jdk`"
            TESTS="$PWD/bundles/tests"
            JT="$PWD/jtreg/installed"

            # A JDK built on NetBSD is marked as it is linked; one cross-built
            # from Linux cannot be, because paxctl(8) only exists here. Without
            # the mark every launcher dies in VM initialisation, because PaX
            # refuses the writable and executable mapping the JIT asks for.
            find "$JDK" "$TESTS" -type f \( -perm -u+x -o -name '*.so' \) -print |
              while read f; do /usr/sbin/paxctl +m "$f" >/dev/null 2>&1 || :; done

            # The launcher failing to find libjli.so has cost two runs now.
            # Say what is actually there and what the binary asks for, so the
            # next failure does not need a third.
            echo "--- what the VM sees ---"
            uname -a
            ls -l "$JDK/lib/libjli.so" || echo "libjli.so is not there"
            readelf -d "$JDK/bin/java" 2>/dev/null | grep -E 'RPATH|RUNPATH|NEEDED' ||
              objdump -p "$JDK/bin/java" 2>/dev/null | grep -E 'RPATH|RUNPATH|NEEDED'
            ldd "$JDK/bin/java" 2>&1 | head -6

            # RPATH is right and the library is there, so the question left is
            # whether this ld.elf_so expands $ORIGIN.  Naming the directory
            # outright answers it: if the launcher starts this way and not the
            # other, $ORIGIN is what is missing.
            echo "--- with the directory named outright ---"
            LD_LIBRARY_PATH="$JDK/lib" "$JDK/bin/java" -version 2>&1 | head -3
            echo "--- end ---"

            "$JDK/bin/java" -version

            gmake test-prebuilt \
              TEST="$TEST_SUITE" \
              BOOT_JDK="$JDK" \
              JT_HOME="$JT" \
              JDK_IMAGE_DIR="$JDK" \
              TEST_IMAGE_DIR="$TESTS" \
              JTREG='JAVA_OPTIONS=-XX:-CreateCoredumpOnCrash;VERBOSE=fail,error,time;KEYWORDS=!headful'

            # make test-prebuilt prints "TEST FAILURE" and then returns 0.  It
            # reports the failure as a file, not as an exit status:
            #
            #   build/run-test-prebuilt/make-support/exit-with-error
            #
            # Upstream's test.yml reads that file in gen-test-summary.sh, puts
            # failure=true into GITHUB_OUTPUT, and a later step calls
            # core.setFailed().  None of it reaches here, because make runs
            # inside the VM and the runner never sees its output file.  So this
            # job stayed green through a run with 15 failing tests, and the
            # only way to know was to read the log.
            #
            # Read the file where make wrote it.
            R=build/run-test-prebuilt
            if [ -f $R/make-support/exit-with-error ]; then
              echo "--- tests that failed ---"
              cat $R/test-results/*/text/newfailures.txt 2>/dev/null || :
              echo "--- tests that errored ---"
              cat $R/test-results/*/text/other_errors.txt 2>/dev/null || :
              echo "--- end ---"
              exit 1
            fi
        env:
          TEST_SUITE: ${{ matrix.test-suite }}

      - name: 'Package test results'
        run: |
          mkdir -p results
          if [ -d build ]; then
            # hs_err too.  A test that crashes leaves its .jtr saying only
            #
            #   # Problematic frame:
            #   #
            #
            # because the frame and the library map are in the hs_err file,
            # and that was not being collected.  Without it a SIGSEGV cannot
            # be attributed to anything -- java/foreign/LibraryLookupTest
            # crashed twice in the same place and there was nothing to read.
            find build -name '*.jtr' -o -name 'summary.txt' -o -name 'stats.txt' \
                       -o -name 'hs_err_pid*.log' -o -name 'replay_pid*.log' |
              while read f; do
                d="results/$(dirname "$f")"; mkdir -p "$d"; cp "$f" "$d/"
              done
          fi
        if: always()

      - name: 'Upload test results'
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ inputs.target-os }}-${{ matrix.test-slug }}
          path: results
          retention-days: 14
        if: always()
